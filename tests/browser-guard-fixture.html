<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Codex Guard Test — no business data</title><style>body{font:16px sans-serif;margin:30px}input{font:22px sans-serif;width:500px;padding:6px}button{font:16px sans-serif;padding:10px;margin:10px}.pulse{animation:pulse .7s infinite alternate}@keyframes pulse{to{opacity:.35}}</style><h1>Disposable guard fixture</h1><p>Chinese / digits input test</p><input id="a" autofocus aria-label="Test input A"><p><input id="b" aria-label="Test input B"></p><button onclick="this.textContent='Clicks: '+(++count)">Clicks: 0</button><button onclick="fetch('/readback',{method:'POST',body:JSON.stringify({a:a.value,b:b.value,count})});this.textContent='Saved'">Save evidence</button><p><button onclick="a.focus();setTimeout(()=>a.value='TARGET CHANGED',2500)">Change value after 2.5s</button><button onclick="a.focus();setTimeout(()=>b.focus(),2500)">Change focus after 2.5s</button></p><p class="pulse">Unrelated animated footer</p><script>let count=0;setTimeout(()=>a.focus(),500)</script>
